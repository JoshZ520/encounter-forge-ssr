services:
  - type: web
    name: encounter-forge
    runtime: docker
    rootDir: EncounterForgeSSR
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:$PORT
      - key: ConnectionStrings__DefaultConnection
        value: Data Source=/var/data/encounterforge.db
    disk:
      name: encounter-data
      mountPath: /var/data
      sizeGB: 1
